x-ddns-base: &ddns-base
  image: favonia/cloudflare-ddns@sha256:345b41895a8846d74c62d30bd27e61101a754f8ab8da10c68115823883803afb
  restart: unless-stopped
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  read_only: true
  mem_limit: 64m
  pids_limit: 64
  cpus: 0.25

services:
  ddns-proxied:
    <<: *ddns-base
    environment:
      - CF_API_TOKEN=${CF_API_TOKEN}
      - DOMAINS=${PROXIED_DOMAINS}
      - PROXIED=true

  ddns-direct:
    <<: *ddns-base
    environment:
      - CF_API_TOKEN=${CF_API_TOKEN}
      - DOMAINS=${DIRECT_DOMAINS}
      - PROXIED=false
